* { margin: 0; padding: 0; box-sizing: border-box; }
body {

}
/* ========== Layout ========== */
.app { display: flex; min-height: 100vh; }
.sidebar {

.nav-item {

  align-items: center;

}
.nav-item:hover { background: rgba(255,255,255,0.1); }
.nav-item.active { background: rgba(255,255,255,0.15); border-left-color: var(--accent); }
.nav-item .icon { font-size: 16px; width: 20px; text-align: center; }
.nav-item .badge {

}
.main { flex: 1; margin-left: var(--sidebar-w); padding: 24px 32px; max-width: calc(100vw - var(--sidebar-w)); }
/* ========== Top Bar ========== */
.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}
.topbar h2 { font-size: 22px; font-weight: 700; }
.topbar .actions { margin-left: auto; display: flex; gap: 10px; }
.btn {

  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;

.btn-primary { background: var(--primary); color: white; }

/* ========== Hamburger Menu ========== */

<script>
// ==================== Config ====================
const SUPABASE_URL = 'https://mixuqjognbdrafrrlivc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_D0ha7g4X4LutG-3hxCguSA_pwyQLrVX';
const DOC_ID = 'error-book-default';
const STUDENT_NAME = localStorage.getItem('eb_student') || 'default';

  errors: [],

};

// ==================== Supabase ====================
async function cloudPush() {
  const payload = { id: DOC_ID, data: { v: 1, errors: state.errors }, updated_at: new Date().toISOString() };
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/gaokao_state?id=eq.${DOC_ID}`, {
      method: 'PATCH',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(payload)
    });
    if (!res.ok) console.warn('cloudPush failed:', res.status);
  } catch(e) { console.warn('cloudPush error:', e); }
}

async function cloudPull() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/gaokao_state?id=eq.${DOC_ID}&select=*`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    if (rows.length > 0 && rows[0].data && rows[0].data.errors) {
      state.errors = rows[0].data.errors;
      return true;
    }
    return false;
  } catch(e) { console.warn('cloudPull error:', e); return false; }
}

// ==================== Init ====================
async function init() {
  try {
    showView('dashboard');
    const pulled = await cloudPull();
    if (!pulled || state.errors.length === 0) {
      state.errors = seedData();
      await cloudPush();
      showToast('已初始化14道错题数据');
    }
    state.loaded = true;
    updateNavBadges();
    render();
  } catch(err) {
    console.warn('Init error, falling back to seed data:', err);
    state.errors = seedData();
    state.loaded = true;
    updateNavBadges();
    render();
    showToast('云端连接失败，已加载本地数据');
  }
}

// ==================== Navigation ====================
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-backdrop').classList.toggle('show');
}
document.querySelectorAll('.nav-item').forEach(item => {
  item.addEventListener('click', () => {
    if (item.dataset.view) {
      state.view = item.dataset.view;
      state.assemblyMode = false;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      render();
    } else if (item.dataset.filter) {
      applyQuickFilter(item.dataset.filter);
    } else if (item.id === 'nav-sync') {
      syncCloud();
    } else if (item.id === 'nav-export') {
      exportData();
    } else if (item.id === 'nav-import') {
      importData();
    }
    if (window.innerWidth <= 768) toggleSidebar();
  });
});

function applyQuickFilter(filter) {
  state.view = 'list';
  state.filter = { subject: '', errorType: '', proficiency: '', search: '' };
  if (filter === 'proficiency-low') state.filter.proficiency = 'low';
  if (filter === 'unsolved') state.filter.isSolved = false;
  if (filter === 'wrong') state.filter.isCorrect = false;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelector('[data-view="list"]').classList.add('active');
  render();
}

// ==================== Render ====================
function typesetMath() {
  if (window.MathJax && window.MathJax.typesetPromise) {
    window.MathJax.typesetPromise().catch(()=>{});
  } else {
    setTimeout(typesetMath, 200);
  }
}
function render() {
  const container = document.getElementById('view-content');
  if (state.view === 'dashboard') container.innerHTML = renderDashboard();
  else if (state.view === 'list') container.innerHTML = renderList();
  else if (state.view === 'assembly') container.innerHTML = renderAssembly();
  else if (state.view === 'courseware') container.innerHTML = renderCoursewareView();
  typesetMath();
  bindEvents();
}

function renderDashboard() {
  const errors = state.errors;
  const total = errors.length;
  const correct = errors.filter(e => e.is_correct).length;
  const wrong = errors.filter(e => !e.is_correct && e.is_solved).length;
  const unsolved = errors.filter(e => !e.is_solved).length;
  const lowProf = errors.filter(e => e.proficiency <= 2).length;
  const byType = {};
  errors.forEach(e => { byType[e.error_type] = (byType[e.error_type]||0)+1; });
  const byKP = {};
  errors.forEach(e => { e.knowledge_points.forEach(kp => { byKP[kp] = (byKP[kp]||0)+1; }); });
  const kpEntries = Object.entries(byKP).sort((a,b)=>b[1]-a[1]).slice(0,8);

  return `
    <div class="topbar"><h2>仪表盘</h2>
      <div class="actions"><button class="btn btn-primary" onclick="openAddModal()">+ 添加错题</button></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card" onclick="drillTo('all')" style="cursor:pointer">
        <div class="stat-icon">📚</div>
        <div class="stat-value">${total}</div><div class="stat-label">总题数</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:100%;background:var(--primary)"></div></div>
      </div>
      <div class="stat-card" onclick="drillTo('correct')" style="cursor:pointer">
        <div class="stat-icon">✅</div>
        <div class="stat-value">${correct}</div><div class="stat-label">正确</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${total?correct/total*100:0}%;background:var(--success)"></div></div>
      </div>
      <div class="stat-card" onclick="drillTo('wrong')" style="cursor:pointer">
        <div class="stat-icon">❌</div>
        <div class="stat-value">${wrong}</div><div class="stat-label">做错</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${total?wrong/total*100:0}%;background:var(--danger)"></div></div>
      </div>
      <div class="stat-card" onclick="drillTo('unsolved')" style="cursor:pointer">
        <div class="stat-icon">⬜</div>
        <div class="stat-value">${unsolved}</div><div class="stat-label">未作答</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${total?unsolved/total*100:0}%;background:var(--accent)"></div></div>
      </div>
      <div class="stat-card" onclick="drillTo('low')" style="cursor:pointer">
        <div class="stat-icon">🔴</div>
        <div class="stat-value">${lowProf}</div><div class="stat-label">待重练（≤2星）</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${total?lowProf/total*100:0}%;background:#dc2626"></div></div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">🔗</div>
        <div class="stat-value">${errors.reduce((s,e)=>s+(e.linked_card_ids?e.linked_card_ids.length:0),0)}</div>
        <div class="stat-label">关联记忆卡</div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px" class="analytics-grid">
      <div class="stat-card">
        <h4 style="font-size:14px;margin-bottom:12px;color:var(--primary)">错误类型分布</h4>
        ${Object.entries(byType).map(([type,count]) => `
          <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
            <span class="tag tag-error" style="min-width:70px;text-align:center">${type}</span>
            <div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${count/total*100}%;background:var(--danger);border-radius:4px"></div>
            </div>
            <span style="font-size:13px;font-weight:700;min-width:24px">${count}</span>
          </div>
        `).join('')}
      </div>
      <div class="stat-card">
        <h4 style="font-size:14px;margin-bottom:12px;color:var(--primary)">知识点热力</h4>
        ${kpEntries.map(([kp,count]) => `
          <div style="display:flex;align-items:center;gap:8px;margin:6px 0">
            <span class="tag tag-kp" style="min-width:80px;text-align:center">${kp}</span>
            <div style="flex:1;height:8px;background:var(--border);border-radius:4px;overflow:hidden">
              <div style="height:100%;width:${count/total*100}%;background:var(--primary);border-radius:4px"></div>
            </div>
            <span style="font-size:13px;font-weight:700;min-width:24px">${count}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderList() {
  let filtered = state.errors;
  if (state.filter.subject) filtered = filtered.filter(e => e.subject === state.filter.subject);
  if (state.filter.errorType) filtered = filtered.filter(e => e.error_type === state.filter.errorType);
  if (state.filter.proficiency === 'low') filtered = filtered.filter(e => e.proficiency <= 2);
  if (state.filter.isSolved === false) filtered = filtered.filter(e => !e.is_solved);
  if (state.filter.isCorrect === false) filtered = filtered.filter(e => !e.is_correct && e.is_solved);
  if (state.filter.isCorrect === true) filtered = filtered.filter(e => e.is_correct);
  if (state.filter.search) {
    const q = state.filter.search.toLowerCase();
    filtered = filtered.filter(e =>
      e.problem_text.toLowerCase().includes(q) ||
      e.source.toLowerCase().includes(q) ||
      e.knowledge_points.some(kp => kp.toLowerCase().includes(q))
    );
  }

  const subjects = [...new Set(state.errors.map(e => e.subject))];
  const errorTypes = [...new Set(state.errors.map(e => e.error_type))];

  return `
    <div class="topbar">
      <h2>错题列表</h2>
      <div class="actions">
        <button class="btn btn-outline" onclick="openAddModal()">+ 添加</button>
        <button class="btn btn-outline" onclick="toggleAssembly()">📝 组卷模式</button>
      </div>
    </div>
    <div class="filter-bar">
      <input class="search-box" placeholder="搜索题干、来源、知识点..." value="${state.filter.search||''}" oninput="state.filter.search=this.value;render()">
      <div class="filter-group">
        <span class="filter-label">科目</span>
        <select class="filter-select" onchange="state.filter.subject=this.value;render()">
          <option value="">全部</option>
          ${subjects.map(s=>`<option value="${s}" ${state.filter.subject===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">错误类型</span>
        <select class="filter-select" onchange="state.filter.errorType=this.value;render()">
          <option value="">全部</option>
          ${errorTypes.map(t=>`<option value="${t}" ${state.filter.errorType===t?'selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">熟练度</span>
        <select class="filter-select" onchange="state.filter.proficiency=this.value;render()">
          <option value="">全部</option>
          <option value="low" ${state.filter.proficiency==='low'?'selected':''}>≤2星 待重练</option>
        </select>
      </div>
      <span style="font-size:13px;color:var(--text-light)">${filtered.length} 题</span>
    </div>
    ${state.assemblyMode ? `
      <div class="assembly-bar">
        <span>已选 <span class="count" id="assembly-count">${state.selected.size}</span> 题</span>
        <button class="btn btn-sm" style="background:white;color:var(--primary)" onclick="generateTestPaper()">生成试卷</button>
        <button class="btn btn-sm" style="background:rgba(255,255,255,0.2);color:white" onclick="toggleAssembly()">退出</button>
      </div>
    ` : ''}

    id: id || 'err-' + Date.now().toString(36),

    subject: document.getElementById('edit-subject').value,
    problem_number: document.getElementById('edit-qnum').value,
    source: document.getElementById('edit-source').value,
    problem_text: document.getElementById('edit-text').value,
    problem_image: document.getElementById('edit-image').value,
    student_answer: document.getElementById('edit-sanswer').value,
    correct_answer: document.getElementById('edit-canswer').value,
    is_correct: isCorrect,
    is_solved: isSolved,
    error_type: document.getElementById('edit-errtype').value,
    proficiency: window._editProf(),
    knowledge_points: document.getElementById('edit-kp').value.split(',').map(s=>s.trim()).filter(Boolean),
    analysis: document.getElementById('edit-analysis').value,
    notes: document.getElementById('edit-notes').value,
    linked_card_ids: document.getElementById('edit-cards').value.split(',').map(s=>s.trim()).filter(Boolean),
    review_count: id ? (state.errors.find(e=>e.id===id).review_count||0) : 0,
    last_reviewed: id ? (state.errors.find(e=>e.id===id).last_reviewed) : null
  };
  if (id) {
    const idx = state.errors.findIndex(e => e.id === id);
    state.errors[idx] = errData;

    state.errors.push(errData);
  }
  closeModal();
  cloudPush();
  updateNavBadges();
  render();
  showToast(id ? '已更新' : '已添加');

function deleteError(id) {
  if (!confirm('确定删除这道错题？')) return;
  state.errors = state.errors.filter(e => e.id !== id);
  closeModal();
  cloudPush();
  updateNavBadges();
  render();
  showToast('已删除');
}

function generateSteps(e) {
  const steps = [];
  if (e.knowledge_points.includes('奇函数') || e.knowledge_points.includes('偶函数')) {
    steps.push({
      title: '判断奇偶性',
      content: '首先检查定义域是否关于原点对称，然后计算 $f(-x)$ 与 $f(x)$ 的关系。',
      hint: e.knowledge_points.includes('奇函数') ? '奇函数：$f(-x)=-f(x)$，定义域含0时 $f(0)=0$' : '偶函数：$f(-x)=f(x)$'
    });
  }
  if (e.knowledge_points.includes('单调性')) {
    steps.push({
      title: '分析单调性',
      content: '求导 $f\'(x)$，判断导数在各区间的正负。或利用复合函数"同增异减"法则。',
      hint: '导数 $f\'(x)>0$ 递增，$f\'(x)<0$ 递减。注意 $f\'(x)=0$ 的点需进一步判断'
    });
  }
  if (e.knowledge_points.includes('求参数') || e.knowledge_points.includes('$f(0)=0$')) {
    steps.push({
      title: '利用特殊值求参数',
      content: '定义域含0的奇函数必有 $f(0)=0$，代入求参数。若0不在定义域，用 $f(a)+f(-a)=0$。',
      hint: '$f(0)=0$ 是必要不充分条件，求出参数后代回验证'
    });
  }
  if (e.knowledge_points.includes('构造方程组')) {
    steps.push({
      title: '构造方程组',
      content: '利用奇偶性条件，将 $x$ 替换为 $-x$ 得到第二个方程，联立求解。',
      hint: '奇函数 $f(-x)=-f(x)$，偶函数 $g(-x)=g(x)$，注意符号方向'
    });
  }
  if (e.knowledge_points.includes('不等式')) {
    steps.push({
      title: '解不等式',
      content: '利用单调性去掉 $f$，将 $f(a)>f(b)$ 转化为 $a>b$（递增）或 $a<b$（递减）。',
      hint: '去 $f$ 前必须保证自变量在定义域内！列定义域约束不等式组'
    });
  }
  if (e.knowledge_points.includes('定义域对称')) {
    steps.push({
      title: '确保定义域对称',
      content: '奇/偶函数的必要条件是定义域关于原点对称。找出奇点，通过对称性约束确定参数。',
      hint: '若 $x=a$ 是奇点（无定义），则 $x=-a$ 也必须是奇点'
    });
  }
  if (e.knowledge_points.includes('最值求和') || e.knowledge_points.includes('$M+m=2b$')) {
    steps.push({
      title: '利用对称性求 $M+m$',
      content: '将函数拆为"奇函数+常数"形式，奇函数的最大值与最小值之和为0，故 $M+m=2b$。',
      hint: '$M+m=2\\times$对称中心纵坐标。轴对称函数不具备此性质'
    });
  }
  if (e.knowledge_points.includes('零点求参') || e.knowledge_points.includes('分段函数')) {
    steps.push({
      title: '分段函数零点分析',
      content: '分别求出各段的可能零点，按零点落在对应定义域内列不等式，分情况讨论。',
      hint: '边界等号需逐点检验！端点处可能只有1个根'
    });
  }
  if (e.knowledge_points.includes('正负转换')) {
    steps.push({
      title: '正负转换',
      content: '利用奇函数 $f(-x)=-f(x)$，将负自变量转到正侧求解。',
      hint: '核心操作：$f(-a)=-f(a)$，先在已知侧求值，再取负'
    });
  }
  steps.push({
    title: '验证与反思',
    content: e.analysis || '回顾解题过程，确认每一步的依据和易错点。',
    hint: e.notes || '思考：这道题的关键信号是什么？下次遇到类似题型如何快速识别？'
  });
  return steps;
}

  modal.innerHTML = `

          <table style="width:100%;font-size:13px;border-collapse:collapse">
            <tr><td style="font-weight:700;color:var(--primary);padding:6px;border-bottom:1px solid var(--border);width:100px">卡片编号</td><td style="padding:6px;border-bottom:1px solid var(--border)">${cardId}</td></tr>
            <tr><td style="font-weight:700;color:var(--primary);padding:6px;border-bottom:1px solid var(--border)">章节知识点</td><td style="padding:6px;border-bottom:1px solid var(--border)">${e.subject}·${e.knowledge_points[0]||''}</td></tr>
            <tr><td style="font-weight:700;color:var(--primary);padding:6px;border-bottom:1px solid var(--border)">题干信号</td><td style="padding:6px;border-bottom:1px solid var(--border)">看到【${e.problem_number} ${signal}】相关题目</td></tr>
            <tr><td style="font-weight:700;color:var(--primary);padding:6px;border-bottom:1px solid var(--border)">结论/易错点</td><td style="padding:6px;border-bottom:1px solid var(--border)">${conclusion}</td></tr>
            <tr><td style="font-weight:700;color:var(--primary);padding:6px;border-bottom:1px solid var(--border)">出处</td><td style="padding:6px;border-bottom:1px solid var(--border)">${e.source}（错题${e.problem_number}）</td></tr>
            <tr><td style="font-weight:700;color:var(--primary);padding:6px">回溯错题</td><td style="padding:6px"><a href="#" onclick="event.preventDefault();openDetailModal('${e.id}')" style="color:var(--primary)">${e.id} → 点击查看原题</a></td></tr>
          </table>
        </div>
      </div>
      <div class="detail-section">
        <h4>编辑卡片内容</h4>
        <div class="form-group">
          <label class="form-label">题干信号（看到什么）</label>
          <textarea class="form-textarea" id="card-signal" rows="2">看到【${e.problem_number} ${signal}】相关题目</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">结论/易错点（想到什么）</label>
          <textarea class="form-textarea" id="card-conclusion" rows="3">${conclusion}</textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-success" onclick="saveCardFromError('${e.id}','${cardId}')">保存记忆卡</button>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

function saveCardFromError(errId, cardId) {
  const e = state.errors.find(x => x.id === errId);
  if (!e) return;
  const signal = document.getElementById('card-signal').value;
  const conclusion = document.getElementById('card-conclusion').value;
  if (!e.linked_card_ids) e.linked_card_ids = [];
  if (!e.linked_card_ids.includes(cardId)) e.linked_card_ids.push(cardId);
  e.generated_card = { id: cardId, signal, conclusion, source_err: errId, created_at: new Date().toISOString() };
  closeModal();
  cloudPush();
  render();
  showToast('记忆卡已生成并关联到错题');
}

function showCardDetail(cardId) {
  const err = state.errors.find(e => e.linked_card_ids && e.linked_card_ids.includes(cardId));
  const modal = document.getElementById('modal');
  let cardData = null;
  if (err && err.generated_card && err.generated_card.id === cardId) {
    cardData = err.generated_card;
  }
  modal.innerHTML = `
    <div class="modal-header">
      <h3>记忆卡详情 - ${cardId}</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      ${cardData ? `
        <div class="detail-section">
          <h4>题干信号</h4>
          <div class="content">${cardData.signal}</div>
        </div>
        <div class="detail-section">
          <h4>结论/易错点</h4>
          <div class="content">${cardData.conclusion}</div>
        </div>
        <div class="detail-section">
          <h4>来源错题</h4>
          <div class="content">
            <a href="#" onclick="event.preventDefault();closeModal();setTimeout(()=>openDetailModal('${cardData.source_err}'),300)" style="color:var(--primary)">
              ${cardData.source_err} → 点击查看原题
            </a>
          </div>
        </div>
      ` : `
        <div class="detail-section">
          <p style="color:var(--text-light)">记忆卡 ${cardId} 关联到当前错题。</p>
          <p style="margin-top:8px">该卡片可能来自外部记忆卡库（Excel导入），未在错题本中生成。</p>
        </div>
      `}
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('show');
}

// ==================== Test Paper Assembly ====================
function toggleAssembly() {
  state.assemblyMode = !state.assemblyMode;
  state.selected.clear();
  render();
}

function generateTestPaper() {
  if (state.selected.size === 0) { showToast('请先选择题目'); return; }
  const selected = state.errors.filter(e => state.selected.has(e.id));
  const html = generateTestPaperHTML(selected);
  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `test_paper_${new Date().toISOString().slice(0,10)}.html`;
  a.click();
  URL.revokeObjectURL(url);
  showToast(`已生成${selected.length}题试卷`);
}

function generateTestPaperHTML(problems) {
  return `<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>重组试卷</title>
<script>MathJax={tex:{inlineMath:[['$','$']],displayMath:[['$$','$$']]}};<\/script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"><\/script>
<style>body{font-family:'Noto Sans SC',sans-serif;max-width:800px;margin:0 auto;padding:40px;line-height:1.8}
h1{text-align:center;border-bottom:2px solid #333;padding-bottom:10px}
.problem{margin:24px 0;padding:16px;border:1px solid #ddd;border-radius:8px}
.problem-num{font-weight:700;font-size:16px;color:#4338ca}
.answer-area{margin-top:12px;min-height:60px;border:1px dashed #ccc;border-radius:4px;padding:8px;color:#999}
.meta{font-size:12px;color:#888;margin-top:8px}</style></head>
<body><h1>重组试卷</h1><p style="text-align:center;color:#666">${new Date().toLocaleDateString()} | 共${problems.length}题</p>
${problems.map((e,i) => `
<div class="problem"><span class="problem-num">${i+1}. (${e.problem_number})</span> ${e.source}
<p style="margin:8px 0">${e.problem_text}</p>
${e.problem_image?`<img src="${e.problem_image}" style="max-width:100%;border-radius:8px;margin:8px 0">`:''}
<div class="answer-area">作答区...</div>
<div class="meta">知识点：${e.knowledge_points.join('、')} | 错误类型：${e.error_type} | 熟练度：${'★'.repeat(e.proficiency)}${'☆'.repeat(5-e.proficiency)}</div>
</div>`).join('')}
<div style="margin-top:40px;border-top:2px solid #333;padding-top:16px">
<h2>答案与解析</h2>
${problems.map((e,i) => `<div style="margin:16px 0"><b>${i+1}.</b> 正确答案：${e.correct_answer}<br><span style="font-size:14px;color:#555">${e.analysis}</span></div>`).join('')}
</div></body></html>`;
}

// ==================== Review Tracking ====================
function markReviewed(errId) {
  const e = state.errors.find(x => x.id === errId);
  if (!e) return;
  e.review_count = (e.review_count || 0) + 1;
  e.last_reviewed = new Date().toISOString();
  if (e.proficiency < 5) e.proficiency++;
  cloudPush();
  closeModal();
  render();
  showToast(`已标记复习（第${e.review_count}次），熟练度+1`);
}

// ==================== Utilities ====================
function openAddModal() { openEditModal(''); }

function closeModal() { document.getElementById('modal-overlay').classList.remove('show'); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateNavBadges() {
  document.getElementById('nav-badge-total').textContent = state.errors.length;
  document.getElementById('nav-badge-low').textContent = state.errors.filter(e=>e.proficiency<=2).length;
  document.getElementById('nav-badge-unsolved').textContent = state.errors.filter(e=>!e.is_solved).length;
  document.getElementById('nav-badge-wrong').textContent = state.errors.filter(e=>!e.is_correct&&e.is_solved).length;
}

async function syncCloud() {
  showToast('正在同步...');
  const ok = await cloudPull();
  if (ok) { updateNavBadges(); render(); showToast('同步成功'); }
  else showToast('同步失败');
}

function exportData() {
  const blob = new Blob([JSON.stringify({ v:1, errors: state.errors }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `error_book_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('已导出');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (data.errors) {
          state.errors = data.errors;
          cloudPush(); updateNavBadges(); render();
          showToast('导入成功');
        }
      } catch(err) { showToast('导入失败：格式错误'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function showView(view) { state.view = view; }

function drillTo(filter) {
  state.view = 'list';
  state.filter = { subject: '', errorType: '', proficiency: '', search: '' };
  if (filter === 'all') { /* no filter */ }
  else if (filter === 'correct') { state.filter.isCorrect = true; }
  else if (filter === 'wrong') { state.filter.isCorrect = false; state.filter.isSolved = true; }
  else if (filter === 'unsolved') { state.filter.isSolved = false; }
  else if (filter === 'low') { state.filter.proficiency = 'low'; }
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const listNav = document.querySelector('[data-view="list"]');
  if (listNav) listNav.classList.add('active');
  render();
  if (window.innerWidth <= 768) toggleSidebar();
}

// ==================== Event Binding ====================
function bindEvents() {
  document.querySelectorAll('.error-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.classList.contains('star') || e.target.closest('.error-card-actions') || e.target.closest('.stars')) return;
      if (state.assemblyMode) {
        const id = card.dataset.id;
        if (state.selected.has(id)) state.selected.delete(id);
        else state.selected.add(id);
        const countEl = document.getElementById('assembly-count');
        if (countEl) countEl.textContent = state.selected.size;
        card.classList.toggle('selected');
        card.querySelector('.checkbox-overlay').textContent = state.selected.has(id) ? '✓' : '';
      } else {
        openDetailModal(card.dataset.id);
      }
    });
  });
  document.querySelectorAll('.star[data-err]').forEach(s => {
    s.addEventListener('click', (e) => {
      e.stopPropagation();
      setProficiency(s.dataset.err, parseInt(s.dataset.idx));
    });
  });
}

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'modal-overlay') closeModal();
});

// ==================== Start ====================
init();
</script>
</body>
</html>
