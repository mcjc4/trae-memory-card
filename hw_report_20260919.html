<style>
  :root{
    --primary:#4f6bf0; --primary-dark:#3b54cf; --primary-light:#e8ecff;
    --success:#1db477; --success-light:#e2f7ee;
    --danger:#ef5470; --danger-light:#fde9ec;
    --warning:#f5a623; --warning-light:#fdf3de;
    --text:#1a2333; --text-light:#6b7792; --border:#e5e9f2; --bg:#f4f6fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:24px}
  .wrap{max-width:1080px;margin:0 auto}
  .header{background:linear-gradient(135deg,var(--primary),#7a5bf0);color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:22px;box-shadow:0 10px 30px rgba(79,107,240,.25)}

  .legend{display:flex;gap:14px;font-size:13px;color:var(--text-light);margin-bottom:16px;flex-wrap:wrap;align-items:center}

  .sol li{margin:4px 0}
  .sol .ans-tip{color:var(--danger);font-weight:700}

  .hits-hint{font-size:12px;color:var(--text-light);margin-top:4px}
  /* 记忆卡条 — 默认收起，点击展开全文 */
  .mcard{border:1px solid var(--border);border-radius:12px;background:#fff;overflow:hidden;transition:border-color .15s,box-shadow .15s}
  .mcard.hit{border-color:var(--primary)}
  .mcard.new{border-color:var(--success)}
  .mcard.open{box-shadow:0 4px 14px rgba(30,41,59,.1)}
  .mc-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;user-select:none}
  .mc-head:hover{background:var(--bg)}
  .mcard.hit .mc-head:hover{background:var(--primary-light)}
  .mcard.new .mc-head:hover{background:var(--success-light)}
  .mc-id{font-size:13px;font-weight:800;white-space:nowrap}
  .mcard.hit .mc-id{color:var(--primary-dark)}
  .mcard.new .mc-id{color:var(--success)}
  .mc-ch{font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mc-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .mcard.hit .mc-tag{background:var(--primary-light);color:var(--primary-dark)}
  .mcard.new .mc-tag{background:var(--success-light);color:var(--success)}
  .mc-chev{font-size:14px;color:var(--text-light);transition:transform .2s;flex-shrink:0}
  .mcard.open .mc-chev{transform:rotate(90deg)}
  .mc-train{border:1.5px solid var(--primary);background:#fff;color:var(--primary-dark);border-radius:8px;padding:4px 12px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .15s}
  .mcard.new .mc-train{border-color:var(--success);color:var(--success)}
  .mc-train:hover{background:var(--primary);color:#fff}
  .mcard.new .mc-train:hover{background:var(--success);color:#fff}
  .mc-train.retry{border-color:var(--danger);color:var(--danger)}
  .mc-train.retry:hover{background:var(--danger);color:#fff}
  .mc-done,.mc-pending,.mc-fail{display:inline-block;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0}
  .mc-done{color:var(--success)}
  .mc-pending{color:#d97706}
  .mc-fail{color:var(--danger)}
  .mcard.done{border-color:var(--success)}
  .mcard.fail{border-color:var(--danger)}
  .mc-body{display:none;padding:0 14px 14px;border-top:1px dashed var(--border);margin-top:0}
  .mcard.open .mc-body{display:block}
  .mc-field{font-size:13px;line-height:1.8;margin-top:10px}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#26324a;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:560px){.card{padding:16px}.header h1{font-size:19px}.ans{gap:10px}.mc-ch{font-size:12px}}

<script>
// ==================== Supabase 训练写入（与 homework_analysis 同一机制） ====================
const SUPABASE_URL='https://mixuqjognbdrafrrlivc.supabase.co';
const SUPABASE_KEY='sb_publishable_D0ha7g4X4LutG-3hxCguSA_pwyQLrVX';
const TABLE='gaokao_state';
const QUEUE_KEY='hw_train_queue';
const STATE_KEY='hw_train_states';
let trainQueue=[]; try{ trainQueue=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){}
// 每卡云端确认状态：none 未加入 / pending 排队待同步 / done 云端已确认 / fail 云端失败
let trainStates={}; try{ trainStates=JSON.parse(localStorage.getItem(STATE_KEY)||'{}'); }catch(e){}
function saveQueue(){ try{ localStorage.setItem(QUEUE_KEY,JSON.stringify(trainQueue)); }catch(e){} }
function saveStates(){ try{ localStorage.setItem(STATE_KEY,JSON.stringify(trainStates)); }catch(e){} }
function queued(id){ return trainQueue.indexOf(id)>=0; }
function trainState(id){ return queued(id) ? (trainStates[id] || 'pending') : 'none'; }

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}

// 云端有行→打标签；无行→新建待训练卡（本地新卡 che0535~ 等），并降级写 localStorage
async function ensureTrain(cardId, isNew, silent){
  async function doPost(){
    let rowId=null, existing=null;
    try{
      const q=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?data->>id=eq.${encodeURIComponent(cardId)}&select=id,data`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
      const rows=await q.json(); if(rows&&rows[0]){rowId=rows[0].id;existing=rows[0].data||{};}
    }catch(e){}
    const isNewCard = !!isNew && !existing.title;
    const data=Object.assign({},existing,{train_tag:'待训练',last_viewed:new Date().toISOString(),new_flag:isNewCard?'新卡未下载':(existing.new_flag||'')},{id:cardId});
    delete data.new_flag2;
    const payload={id:rowId||('card-lib-'+cardId),data:Object.assign({id:cardId},data),updated_at:new Date().toISOString()};
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify(payload)});
    return res.ok;
  }
  let ok=false;
  // 指数退避重试(共5次:0.4s/0.8s/1.6s/3.2s)，抵御 Supabase 偶发 ERR_ABORTED 瞬断
  for(let i=0;i<5 && !ok;i++){
    try{ ok=await doPost(); }catch(e){ ok=false; }
    if(!ok && i<4) await new Promise(r=>setTimeout(r, 400*Math.pow(2,i)));
  }
  // localStorage 双写（本机兜底）
  try{const m=JSON.parse(localStorage.getItem('card_train_tags')||'{}');m[cardId]=Object.assign({},m[cardId],{train_tag:'待训练',last_viewed:new Date().toISOString()});localStorage.setItem('card_train_tags',JSON.stringify(m));}catch(e){}
  if(!ok && !silent) toast('⚠️ 网络抖动，云端同步失败，可点「重试」或刷新页面自动补推');
  return ok;
}

function toggleTrain(cardId,isNew,btn){
  const i=trainQueue.indexOf(cardId);
  if(i>=0){
    trainQueue.splice(i,1); delete trainStates[cardId]; saveQueue(); saveStates();
    renderCards();
    toast('已从待训练移除 '+cardId);
    return;
  }
  trainQueue.push(cardId); trainStates[cardId]='pending'; saveQueue(); saveStates();
  toast('⏳ 加入中…');
  ensureTrain(cardId, !!isNew, true).then(ok=>{
    trainStates[cardId] = ok ? 'done' : 'fail'; saveStates(); renderCards();
    toast(ok ? '✅ 已加入待训练：'+cardId : '⚠️ 网络抖动云端同步失败，点「重试」或刷新自动补推');
  });
}
function retryTrain(cardId,isNew,btn){
  if(btn){ btn.disabled=true; btn.textContent='同步中…'; }
  trainStates[cardId]='pending'; saveStates(); renderCards();
  ensureTrain(cardId, !!isNew, true).then(ok=>{
    trainStates[cardId] = ok ? 'done' : 'fail'; saveStates(); renderCards();
    toast(ok ? '✅ 已加入待训练：'+cardId : '⚠️ 云端同步仍失败，可刷新页面自动补推');
  });
}
function renderCards(){
  document.getElementById('list').innerHTML = QUESTIONS.map(p=>`
  <div class="card">
    <div class="card-top">
      <span class="qno">题目 ${p.q}</span>
      <span class="badge ${p.status==='ok'?'ok':(p.status==='no'?'no':'warn')}">${p.status==='ok'?'答对':(p.status==='no'?'答错':'待核对')}</span>
      <span style="font-size:13px;color:var(--text-light)">${p.chapter}</span>
    </div>
    <div class="card-sub">${p.q===11?'解答题·6 小问':'单选题'}</div>
    <div class="ans">
      <span><b>学生作答</b>：${p.student}</span>
      <span><b>正确</b>：${p.answer}</span>
    </div>
    <div class="sec">💡 解题思路</div>
    <div class="sol"><ol>${p.sol.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    ${p.q===11?'<div class="q11-note">提示：(3) 的 pH 区间、(5) 的 c(F⁻) 计算建议回到 process 流程逐段核对。</div>':''}
    <div class="sec">🎯 命中的记忆卡 ${p.hits.length+p.news.length ? '' : '（未命中既有卡）'}</div>
    <div class="hits">
      ${p.hits.map(id=>kchip(id,false)).join('')}
      ${p.news.map(id=>kchip(id,true)).join('')}
      <span class="hits-hint">点击卡条展开思路全文 · 点击「+训练」加入待训练队列</span>
    </div>
    <img class="shot" src="${p.shot}" alt="原题截图 题目${p.q}">
    <div class="shot-cap">原题截图 · 题目 ${p.q}</div>
  </div>
`).join('');
}

// ==================== 记忆卡数据查找（从 cards_data.js） ====================
const CARD_MAP = (typeof CARDS_DATA !== 'undefined') ? Object.fromEntries(CARDS_DATA.map(c => [c.id, c])) : {};

function cardInfo(id){
  const c = CARD_MAP[id];
  if(!c) return {chapter:'(卡库未找到)', signal:'—', conclusion:'—', source:''};
  return {chapter:c.chapter||'', signal:c.signal||'', conclusion:c.conclusion||'', source:c.source||''};
}

// 展开/收起
function toggleMcard(head){
  const mc = head.closest('.mcard');
  mc.classList.toggle('open');
}

// ==================== 记忆卡条（默认收起，点击展开全文） ====================
function kchip(id,isNew){
  const info = cardInfo(id);
  const st = trainState(id);
  const cls = (isNew?'new':'hit') + (st==='done'?' done':st==='fail'?' fail':'');
  const tagTxt = isNew ? '新增' : '命中';
  const statusTxt = st==='done'?'✓ 已入训练':st==='pending'?'⏳ 待同步':st==='fail'?'⚠️ 云端失败':'';
  const statusCls = st==='done'?'mc-done':st==='pending'?'mc-pending':st==='fail'?'mc-fail':'';
  let btn='';
  if(st==='none') btn=`<button class="mc-train" onclick="event.stopPropagation();toggleTrain('${id}',${isNew?'1':'0'},this)">+训练</button>`;
  else if(st==='fail') btn=`<button class="mc-train retry" onclick="event.stopPropagation();retryTrain('${id}',${isNew?'1':'0'},this)">重试</button>`;
  else if(st==='pending') btn=`<button class="mc-train" onclick="event.stopPropagation();toggleTrain('${id}',${isNew?'1':'0'},this)">撤销</button>`;
  return `<div class="mcard ${cls}" data-id="${id}">
    <div class="mc-head" onclick="toggleMcard(this)">
      <span class="mc-id">${id}</span>
      <span class="mc-ch">${info.chapter}</span>
      <span class="mc-tag">${tagTxt}</span>
      <span class="mc-chev">▸</span>
      ${statusTxt?`<span class="${statusCls}">${statusTxt}</span>`:''}
      ${btn}
    </div>
    <div class="mc-body">
      <div class="mc-field"><span class="lbl">信号</span>${info.signal}</div>
      <div class="mc-field"><span class="lbl">结论</span>${info.conclusion}</div>
      ${info.source ? `<div class="mc-field"><span class="lbl">出处</span>${info.source}</div>` : ''}
    </div>
  </div>`;
}

// ==================== 批改数据 ====================
const QUESTIONS=[
 {q:1,status:'ok',student:'A',answer:'A',chapter:'STSE·材料与硅',
  sol:['5G 手机芯片关键材料是高纯 <b>单质硅 Si</b>（半导体），不是 SiO₂ → A 为“不正确”的对应，是题干所求答案。',
       '氧化物：SiO₂ 用于光导纤维（光的全反射）、石英玻璃；陶瓷/硅酸盐属无机非金属材料，铝合金属金属材料。'],

 {q:3,status:'no',student:'C',answer:'A',chapter:'化学键·σπ计数/VSEPR/极性',
  sol:['A ✓：丙烯 C₃H₆ 结构 CH₂=CH−CH₃ → σ键 8 个（6 个 C−H＋2 个 C−C）、π键 1 个，比<b>8∶1</b>。',
