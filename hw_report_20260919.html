<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026.9.19 化学周末作业(二)·错题新做 — 批改报告</title>
<style>
  :root{
    --primary:#4f6bf0; --primary-dark:#3b54cf; --primary-light:#e8ecff;
    --success:#1db477; --success-light:#e2f7ee;
    --danger:#ef5470; --danger-light:#fde9ec;
    --warning:#f5a623; --warning-light:#fdf3de;
    --text:#1a2333; --text-light:#6b7792; --border:#e5e9f2; --bg:#f4f6fb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.7;padding:24px}
  .wrap{max-width:1080px;margin:0 auto}
  .header{background:linear-gradient(135deg,var(--primary),#7a5bf0);color:#fff;border-radius:18px;padding:26px 30px;margin-bottom:22px;box-shadow:0 10px 30px rgba(79,107,240,.25)}
  .header h1{font-size:24px;margin-bottom:6px}
  .header .sub{opacity:.92;font-size:14px}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
  .status-chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:12px;padding:10px 16px;font-size:14px;backdrop-filter:blur(4px)}
  .status-chip b{font-size:20px;margin-right:4px}
  .legend{display:flex;gap:14px;font-size:13px;color:var(--text-light);margin-bottom:16px;flex-wrap:wrap;align-items:center}
  .pill{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:50%}
  .card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:20px;box-shadow:0 3px 12px rgba(30,41,59,.05)}
  .card-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .qno{font-size:18px;font-weight:800;color:var(--primary)}
  .badge{font-size:12px;font-weight:700;padding:4px 12px;border-radius:999px;color:#fff}
  .badge.ok{background:var(--success)} .badge.no{background:var(--danger)} .badge.warn{background:var(--warning)}
  .card-sub{color:var(--text-light);font-size:13px;margin-bottom:14px}
  .ans{display:flex;gap:22px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:12px 16px;margin:12px 0;font-size:14px}
  .ans b{color:var(--primary-dark)}
  .sec{font-weight:700;font-size:14px;color:var(--primary-dark);margin:14px 0 8px}
  .sol{font-size:14px;background:var(--primary-light);border-left:4px solid var(--primary);border-radius:8px;padding:12px 16px}
  .sol ol{margin-left:20px}
  .sol li{margin:4px 0}
  .sol .ans-tip{color:var(--danger);font-weight:700}
  .hits{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .kcard{border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:13px;background:#fff;display:inline-flex;align-items:center;gap:6px}
  .kcard.hit{border-color:var(--primary);color:var(--primary-dark);background:var(--primary-light)}
  .kcard.new{border-color:var(--success);color:var(--success);background:var(--success-light)}
  .kcard button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:12px;font-weight:700;padding:0 2px}
  .kcard button:hover{text-decoration:underline}
  .kcard.done button{display:none}
  .kcard.done::after{content:"✓ 已入训练";font-size:11px;opacity:.8}
  .shot{width:100%;max-width:520px;border:1px solid var(--border);border-radius:10px;margin-top:12px;display:block}
  .shot-cap{font-size:12px;color:var(--text-light);margin-top:4px}
  .q11-note{font-size:13px;color:var(--warning);background:var(--warning-light);border-radius:8px;padding:8px 12px;margin-top:8px}
  .foot{text-align:center;color:var(--text-light);font-size:12px;margin:26px 0 10px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#26324a;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:560px){.card{padding:16px}.header h1{font-size:19px}.ans{gap:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>✏️ 化学周末作业(二)·错题新做 — 批改报告</h1>
    <div class="sub">2027届高三化学 · 学生 陈昕言（12班·24号） · 批改日期 2026-09-19 · 全卷 11 题</div>

      <div class="status-chip">✅ 正确 <b>7</b></div>

  </div>

  <div class="legend">
    <span class="pill"><span class="dot" style="background:var(--primary)"></span>命中断既有记忆卡</span>
    <span class="pill"><span class="dot" style="background:var(--success)"></span>本次新增通用记忆卡</span>
    <span class="pill">点击卡号即可加入待训练</span>

</div>
<div class="toast" id="toast"></div>

<script>
// ==================== Supabase 训练写入（与 homework_analysis 同一机制） ====================
const SUPABASE_URL='https://mixuqjognbdrafrrlivc.supabase.co';
const SUPABASE_KEY='sb_publishable_D0ha7g4X4LutG-3hxCguSA_pwyQLrVX';
const TABLE='gaokao_state';
const QUEUE_KEY='hw_train_queue';
let trainQueue=[]; try{ trainQueue=JSON.parse(localStorage.getItem(QUEUE_KEY)||'[]'); }catch(e){}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}

// 云端有行→打标签；无行→新建待训练卡（本地新卡 che0535~ 等），并降级写 localStorage
async function ensureTrain(cardId, isNew){
  let rowId=null, existing=null;
  try{
    const q=await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?data->>id=eq.${encodeURIComponent(cardId)}&select=id,data`,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
    const rows=await q.json(); if(rows&&rows[0]){rowId=rows[0].id;existing=rows[0].data||{};}
    const data=Object.assign({},existing,{train_tag:'待训练',last_viewed:new Date().toISOString(),new_flag:isNew?'新卡未下载':(existing.new_flag||'')},isNew&&!existing.title?{}:{},existing.id?{}:{id:cardId});
    delete data.new_flag2;
    const payload={id:rowId||('card-lib-'+cardId),data:Object.assign({id:cardId},data),updated_at:new Date().toISOString()};
    await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`,{method:'POST',headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify(payload)});
  }catch(e){console.warn('train err',e);}
  // localStorage 双写
  try{const m=JSON.parse(localStorage.getItem('card_train_tags')||'{}');m[cardId]=Object.assign({},m[cardId],{train_tag:'待训练',last_viewed:new Date().toISOString()});localStorage.setItem('card_train_tags',JSON.stringify(m));}catch(e){}
}

function toggleTrain(cardId,isNew,btn){
  const i=trainQueue.indexOf(cardId);
  if(i>=0){ trainQueue.splice(i,1); btn.closest('.kcard').classList.remove('done'); toast('已从待训练移除 '+cardId); }
  else{ trainQueue.push(cardId); ensureTrain(cardId,!!isNew); btn.closest('.kcard').classList.add('done'); toast('✅ 已加入待训练：'+cardId); }
  localStorage.setItem(QUEUE_KEY,JSON.stringify(trainQueue));
}
function queued(id){return trainQueue.indexOf(id)>=0;}

// ==================== 批改数据 ====================
const QUESTIONS=[
 {q:1,status:'ok',student:'A',answer:'A',chapter:'STSE·材料与硅',
  sol:['5G 手机芯片关键材料是高纯 <b>单质硅 Si</b>（半导体），不是 SiO₂ → A 为“不正确”的对应，是题干所求答案。',
       '氧化物：SiO₂ 用于光导纤维（光的全反射）、石英玻璃；陶瓷/硅酸盐属无机非金属材料，铝合金属金属材料。'],

  hits:['che0514','che0511','che0492'], news:['che0537'], shot:'homework_crops/chem_week2/q4.jpg'},
 {q:5,status:'ok',student:'D',answer:'D',chapter:'结构⇢性质“不能推测”',
  sol:['A 能：乙烯含 π 键 → 易发生<b>加成</b>（π 键易断）。',
       'B 能：I₂ 与 CCl₄ 均非极性 → <b>相似相溶</b>。',

  sol:['A 能：键能 H−F>H−Cl>H−Br → 热稳定性同序（热稳定性由<b>键能</b>决定）。',

       'C 能：O₃ 极性>O₂ → <b>相似相溶</b>水溶性 O₃>O₂。',

  hits:['che0267','che0262','che0285'], news:['che0538'], shot:'homework_crops/chem_week2/q6.jpg'},

       'D ✓：实验②均无 Fe²⁺ → 两种保护都有效；Ⅰ有蓝沉淀（微量 Fe²⁺）而Ⅱ无 → <b>Ⅱ保护更彻底</b>。'],
  hits:['che0425','che0128','che0127'], news:[], shot:'homework_crops/chem_week2/q7.jpg'},
 {q:8,status:'ok',student:'A',answer:'A',chapter:'物质的量·Nₐ',
  sol:['A ✓：¹⁸O 中子 10、¹⁶O 中子 8，1 mol ¹⁸O₂ 中子 20Nₐ、¹⁶O₂ 为 16Nₐ，差 <b>4Nₐ</b>。',
       'B ✗：0.1 mol/L 只给<b>浓度未给体积</b>，求不出 K⁺ 总数。',
       'C ✗：1 mol Na→Na⁺ 只转移 <b>1Nₐ</b> 电子（失 1e⁻），不是 2Nₐ。',
       'D ✗：标况 22.4 L 混合气体（N₂+O₂）= <b>1 mol = 1Nₐ</b> 个分子，不是 2Nₐ。'],

       'D（题干求“不正确”）✗/为答案：Cu 与 S 化合生成的是 <b>Cu₂S</b>，而题干“W₂M=CuS”的说法不规范，故选 D。'],
  hits:['che0246','che0291','che0274'], news:[], shot:'homework_crops/chem_week2/q9.jpg'},
 {q:10,status:'ok',student:'D',answer:'D',chapter:'电化学·双膜电解（制 LiOH）',
  sol:['甲膜为<b>阳离子交换膜</b>（Li⁺ 穿过进入阴室得 LiOH），乙膜为<b>阴离子交换膜</b>（SO₄²⁻ 穿过进入阳室得 H₂SO₄）。',

       '(3) 待核对：调 pH 需使 Fe³⁺/Al³⁺ 完全沉淀（沉淀完全 pH 之上）而撮 Mn²⁺ 不沉淀（其开始沉淀 pH 之下），按表取区间。',
       '(4) ✓ 除锌：Zn²⁺+S²⁻=ZnS↓；另 MnF₂ 沉淀 Mg²⁺ 生成 MgF₂ 除镁。',
       '(5) 空白：(5) 的最小 c(F⁻)：沉淀完全 c(Mg²⁺)<1×10⁻⁵，Ksp=[Mg²⁺][F⁻]²=4×10⁻¹¹ → [F⁻]=√(4×10⁻⁶)=<b>2×10⁻³ mol/L</b>。',

function kchip(id,isNew){
  const done=queued(id)?' done':'';
  return `<span class="kcard ${isNew?'new':'hit'}${done}">${id}${isNew?'(新)':''} <button onclick="toggleTrain('${id}',${isNew?'1':'0'},this)">+训练</button></span>`;
}

document.getElementById('list').innerHTML = QUESTIONS.map(p=>`
  <div class="card">
    <div class="card-top">
      <span class="qno">题目 ${p.q}</span>
      <span class="badge ${p.status==='ok'?'ok':(p.status==='no'?'no':'warn')}">${p.status==='ok'?'答对':(p.status==='no'?'答错':'待核对')}</span>
      <span style="font-size:13px;color:var(--text-light)">${p.chapter}</span>
    </div>
    <div class="card-sub">${p.q===11?'解答题·6 小问':'单选题'}</div>
    <div class="ans">
      <span><b>学生作答</b>：${p.student}</span>
      <span><b>正确</b>：${p.answer}</span>
    </div>
    <div class="sec">💡 解题思路</div>
    <div class="sol"><ol>${p.sol.map(s=>`<li>${s}</li>`).join('')}</ol></div>
    ${p.q===11?'<div class="q11-note">提示：(3) 的 pH 区间、(5) 的 c(F⁻) 计算建议回到 process 流程逐段核对。</div>':''}
    <div class="sec">🎯 命中的记忆卡 ${p.hits.length+p.news.length ? '' : '（未命中既有卡）'}</div>
    <div class="hits">
      ${p.hits.map(id=>kchip(id,false)).join('')}
      ${p.news.map(id=>kchip(id,true)).join('')}
      <span style="font-size:12px;color:var(--text-light);align-self:center">点击卡号加入训练，训练队列将在记忆卡库「📜 训练记录」中聚合并开始</span>
    </div>
    <img class="shot" src="${p.shot}" alt="原题截图 题目${p.q}">
    <div class="shot-cap">原题截图 · 题目 ${p.q}</div>
  </div>
`).join('');
</script>
</body>
</html>
